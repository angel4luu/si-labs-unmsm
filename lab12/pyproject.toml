[project]
name = "si-lab12-alexnet-transfer-learning"
version = "1.0.0"
description = "Laboratorio 12 de Software Inteligente: análisis de AlexNet preentrenada, entrenamiento desde cero, extracción de características y fine-tuning sobre Rock-Paper-Scissors"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib>=3.11,<4",
  "numpy>=2.5,<3",
  "pandas>=3.1,<4",
  "scikit-learn>=1.9,<2",
  "torch>=2.15,<3",
  "torchvision>=0.29,<1",
]

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = false
