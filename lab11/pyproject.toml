[project]
name = "si-lab11-image-preprocessing"
version = "1.0.0"
description = "Laboratorio 11 de Software Inteligente: preprocesamiento de imágenes (filtros y transformaciones geométricas) sobre Rock-Paper-Scissors"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib>=3.11,<4",
  "numpy>=2.5,<3",
  "opencv-python-headless>=5,<6",
  "pandas>=3.1,<4",
]

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[tool.uv]
package = false
