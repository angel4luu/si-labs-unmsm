[project]
name = "si-lab13-clustering-texto"
version = "1.0.0"
description = "Laboratorio 13 de Software Inteligente: clustering de textos (BBC News) con K-Means, Ward y DBSCAN"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib>=3.11,<4",
  "numpy>=2.5,<3",
  "pandas>=3.1,<4",
  "scikit-learn>=1.9,<2",
]

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[tool.uv]
package = false
