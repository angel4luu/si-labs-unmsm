[project]
name = "si-lab10-diabetes-classification"
version = "1.0.0"
description = "Laboratorio 10 de Software Inteligente: comparación de modelos de clasificación (Pima Indians Diabetes)"
requires-python = ">=3.14,<3.15"
dependencies = [
  "joblib>=1.6,<2",
  "matplotlib>=3.11,<4",
  "numpy>=2.5,<3",
  "pandas>=3.1,<4",
  "scikit-learn>=1.9,<2",
  "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[tool.uv]
package = false
