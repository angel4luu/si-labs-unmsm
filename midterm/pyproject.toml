[project]
name = "si-midterm-presentation"
version = "1.0.0"
description = "Ejercicios reproducibles y presentación del examen parcial de Software Inteligente"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.3,<3",
  "pandas>=3.0,<4",
  "pillow>=12,<13",
  "python-pptx>=1.0,<2",
]

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "jsonschema[format]>=4.25,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py"]

[tool.matplotlib]
backend = "Agg"
